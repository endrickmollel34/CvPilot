name: Deploy

# Gated on CI ("CI" workflow, .github/workflows/ci.yml) actually passing for
# the same commit — a workflow_run trigger, not the push/pull_request events
# CI itself listens for. This is the standard GitHub Actions pattern for
# "deploy only after a separate validation workflow succeeds": deploy.yml
# only ever starts once ci.yml's run for this exact commit has *completed*,
# and each job's `if` condition below additionally requires conclusion ==
# 'success'. A commit whose lint/typecheck/unit/e2e/security-audit jobs
# don't all pass can therefore never reach the deploy steps. See head_sha
# checkouts below — workflow_run defaults to checking out the default
# branch, so each job explicitly checks out the commit CI actually ran on.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Railway staging deploy
      - name: Deploy API to Railway (staging)
        uses: railwayapp/railway-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          service: api

      # Vercel preview is automatic on PR — no action needed here
      # Vercel GitHub integration handles frontend preview deployments

      - name: Smoke test staging
        run: |
          sleep 10
          curl --fail "${{ vars.STAGING_API_URL }}/api/health" || exit 1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    environment: production
    needs: []
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Run migrations before deploying new code
      - name: Run database migrations
        run: npm run migration:run --workspace=apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Deploy API to Railway (production)
        uses: railwayapp/railway-action@v1
        with:
          railway_token: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
          service: api

      # Vercel production deploy triggers automatically on push to main
      # via Vercel GitHub integration

      - name: Post-deploy health check
        run: |
          sleep 15
          curl --fail "${{ vars.PRODUCTION_API_URL }}/api/health" || exit 1

      # Sentry is not yet integrated (see CLAUDE.md "Monitoring") — the
      # release-notification step was removed rather than left pointing at
      # secrets/a project that don't exist, since a step that can fail for
      # reasons unrelated to the deploy itself is worse than no step.
      # Re-add once Sentry is actually wired into the codebase.
