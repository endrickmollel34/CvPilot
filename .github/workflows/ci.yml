name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Several apps/api spec files build a real NestJS TestingModule wired to
    # BullModule (RedisRepository/real Redis) rather than mocking it —
    # ai-rate-limit.guard.integration.spec.ts, ai-rate-limit.service.spec.ts,
    # cv-builder-quota-lock.integration.spec.ts, cv-prefill-lock.integration.spec.ts,
    # prefill-lock.service.spec.ts. Confirmed via a real CI run's own logs
    # (`gh run view --log-failed`) that without a Redis service + REDIS_URL,
    # `ConfigService.getOrThrow('REDIS_URL')` throws during module
    # compilation — this job never had Redis, unlike test-e2e below.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run tests
        run: npm run test

  test-e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cvpilot
          POSTGRES_PASSWORD: cvpilot
          POSTGRES_DB: cvpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cvpilot:cvpilot@localhost:5432/cvpilot_test
      REDIS_URL: redis://localhost:6379
      # Pre-existing gap, only just exposed now that the Build step itself
      # succeeds (see the commit history around this line) -- AppModule's
      # real boot (test/app.e2e-spec.ts) needs every getOrThrow()'d config
      # key to exist, even though this job only ever makes real network
      # calls to the Postgres/Redis services above and never a real
      # third-party API. "placeholder" is this codebase's OWN established,
      # deliberate convention for exactly this scenario -- it's checked
      # explicitly (`.includes('placeholder')`) in ClerkGuard,
      # StripeProvider, CvService (CLOUDFLARE_R2_*), ContactService, and
      # optional-api-key.util.ts, each logging a clear warning and
      # degrading gracefully rather than crashing. Confirmed by reading
      # every one of those call sites, not assumed. These values are
      # never valid credentials for any real provider.
      CLERK_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      CLERK_WEBHOOK_SECRET: whsec_ci_placeholder_not_a_real_secret
      OPENAI_API_KEY: sk-ci-placeholder-not-a-real-key
      RESEND_FROM_EMAIL: ci-placeholder@example.com
      STRIPE_SECRET_KEY: sk_test_ci_placeholder_not_a_real_key
      STRIPE_WEBHOOK_SECRET: whsec_ci_placeholder_not_a_real_secret
      STRIPE_PRICE_PRO_MONTHLY: price_ci_placeholder
      STRIPE_PRICE_PRO_ANNUAL: price_ci_placeholder
      STRIPE_PRICE_PRO_MONTHLY_INTRO: price_ci_placeholder
      CLOUDFLARE_R2_ACCESS_KEY_ID: ci_placeholder_not_a_real_key
      CLOUDFLARE_R2_SECRET_ACCESS_KEY: ci_placeholder_not_a_real_secret
      CLOUDFLARE_R2_BUCKET_NAME: ci-placeholder-bucket
      CLOUDFLARE_R2_ENDPOINT: https://ci-placeholder.r2.cloudflarestorage.com
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Separate, pre-existing gap discovered alongside the Clerk/R2
      # placeholders above: this job's Postgres service starts genuinely
      # empty (no schema), and nothing ever ran migrations against it --
      # only exposed once the Build step itself started succeeding.
      # cover-letter-structured-cv.e2e-spec.ts does real entity inserts
      # (not just GET /api/health, which needs no schema) and fails with
      # a confusing "Cannot read properties of undefined" once its own
      # setup silently can't create rows against nonexistent tables.
      - name: Run migrations
        run: npm run migration:run --workspace=apps/api
        env:
          DATABASE_URL: postgresql://cvpilot:cvpilot@localhost:5432/cvpilot_test

      - name: E2E Tests
        run: npm run test:e2e --workspace=apps/api

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        # Threshold is "critical" until NestJS v10→v11 upgrade resolves the
        # high-severity transitive issues in @nestjs/cli (webpack/multer/uuid).
        # Those issues do not affect our attack surface (no buildHttp, no multer
        # for file uploads, no uuid v3/v5/v6 buf usage). Track in Sprint 2.
        run: npm audit --audit-level=critical
